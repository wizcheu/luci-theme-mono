<form onsubmit="return false"><div class="cbi-map" id="view">
 <h2>系统</h2><div class="cbi-map-descr">配置主机名、时区和界面语言。本地预览中的修改不会写入路由器。</div>
 <ul class="cbi-tabmenu"><li class="cbi-tab"><a href="/cgi-bin/luci/admin/system/system">常规设置</a></li><li class="cbi-tab-disabled"><a href="/cgi-bin/luci/admin/status/components">组件样式</a></li></ul>
 <div class="cbi-section"><h3>常规设置</h3><div class="cbi-section-descr">这台设备的基本信息。</div><div class="cbi-section-node">
  <div class="cbi-value"><label class="cbi-value-title" for="hostname">主机名</label><div class="cbi-value-field"><input class="cbi-input-text" id="hostname" value="OpenWrt"><div class="cbi-value-description">在局域网中标识这台路由器。</div></div></div>
  <div class="cbi-value"><label class="cbi-value-title" for="timezone">时区</label><div class="cbi-value-field"><select class="cbi-input-select" id="timezone"><option>Asia / Singapore</option><option>Asia / Shanghai</option><option>UTC</option></select></div></div>
  <div class="cbi-value"><label class="cbi-value-title" for="description">描述</label><div class="cbi-value-field"><input class="cbi-input-text" id="description" placeholder="例如：客厅主路由"></div></div>
  <div class="cbi-value"><label class="cbi-value-title" for="sync">启用 NTP 客户端</label><div class="cbi-value-field"><input class="cbi-input-checkbox" id="sync" type="checkbox" checked><div class="cbi-value-description">与网络时间服务器保持同步。</div></div></div>
 </div></div>
 <div class="cbi-section"><h3>语言和界面</h3><div class="cbi-section-node">
  <div class="cbi-value"><label class="cbi-value-title" for="language">语言</label><div class="cbi-value-field"><select id="language"><option>简体中文</option><option>English</option></select></div></div>
  <div class="cbi-value"><label class="cbi-value-title" for="theme">主题</label><div class="cbi-value-field"><select id="theme"><option>Mono</option></select><div class="cbi-value-description">黑白配色、清晰层次，专注于网络管理。</div></div></div>
 </div></div>
 <div class="cbi-page-actions"><button class="cbi-button" type="button" data-demo-action="reset">重置</button><button class="cbi-button" type="button" data-demo-action="save">保存</button><button class="cbi-button cbi-button-apply" type="button" data-demo-action="apply">保存并应用</button></div>
</div></form>
