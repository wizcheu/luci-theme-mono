<div class="cbi-map" id="view"><h2>组件预览</h2><div class="cbi-map-descr">验证 LuCI 常用控件与提示状态。仅用于开发预览，不安装到路由器。</div>
 <div class="alert-message warning"><h4>尚有未应用的更改</h4><p>保存并应用后，更改才会在系统中生效。</p></div>
 <div class="alert-message error" role="alert"><h4>无法保存设置</h4><p>请检查标记的输入项，然后重试。</p></div>
 <div class="alert-message success"><h4>设置已保存</h4><p>这是成功提示的样式示例。</p></div>
 <div class="cbi-section"><h3>输入与操作</h3>
  <div class="cbi-value"><label class="cbi-value-title" for="invalid">IP 地址</label><div class="cbi-value-field"><input id="invalid" value="192.168.1.999" class="cbi-input-invalid" aria-invalid="true"><div class="cbi-value-description">请输入有效的 IPv4 地址。</div></div></div>
  <div class="cbi-value"><label class="cbi-value-title" for="disabled">只读字段</label><div class="cbi-value-field"><input id="disabled" disabled value="此项不可修改"></div></div>
  <div class="cbi-value"><label class="cbi-value-title" for="textarea">自定义配置</label><div class="cbi-value-field"><textarea id="textarea" rows="4" style="width:100%"># 示例配置
option enabled '1'</textarea></div></div>
  <div class="cbi-value"><span class="cbi-value-title">按钮</span><div class="cbi-value-field"><button class="cbi-button cbi-button-apply" data-demo-action="apply">主要操作</button> <button class="cbi-button" data-demo-action="edit">打开弹窗</button> <button class="cbi-button cbi-button-remove" data-demo-action="remove">删除</button> <button class="cbi-button" disabled>不可用</button></div></div>
 </div>
 <div class="cbi-section"><h3>暂无数据</h3><p class="cbi-section-descr">目前没有可显示的记录。连接设备后，这里将显示相关信息。</p></div>
</div>
