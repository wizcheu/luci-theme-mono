name: Build Mono theme

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build pinned ucode template checker
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libjson-c-dev
          git clone https://github.com/jow-/ucode.git "$RUNNER_TEMP/ucode-src"
          git -C "$RUNNER_TEMP/ucode-src" checkout cef2a90f57835c38ab85157a07c4ab3c12925307
          cmake -S "$RUNNER_TEMP/ucode-src" -B "$RUNNER_TEMP/ucode-build" -DDEBUG_SUPPORT=OFF -DFFI_SUPPORT=OFF -DDIGEST_SUPPORT=OFF
          cmake --build "$RUNNER_TEMP/ucode-build" --target ucode fs_lib -j2
          "$RUNNER_TEMP/ucode-build/ucode" -L "$RUNNER_TEMP/ucode-build" -L "$GITHUB_WORKSPACE/preview/stubs" scripts/render-preview.uc
          git diff --exit-code -- preview/generated
      - name: Validate package and hooks
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node --check htdocs/luci-static/resources/menu-mono.js
          node --check htdocs/luci-static/mono/shell.js
          node --check htdocs/luci-static/mono/appearance.js
          sh -n root/etc/uci-defaults/30_luci-theme-mono
      - name: Test browser interactions and responsive layouts
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Package
        run: |
          python3 scripts/build.py
          git archive --format=tar.gz --prefix=luci-theme-mono/ HEAD > dist/luci-theme-mono-source.tar.gz
          cd dist
          sha256sum luci-theme-mono-source.tar.gz >> SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: luci-theme-mono
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mono-browser-previews
          path: |
            preview/screenshots/
            test-results/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: luci-theme-mono
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
